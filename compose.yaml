services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: sqlite:////app/data/contextflow.db
    volumes:
      - contextflow_data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
volumes:
  contextflow_data:
